<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:" />
    <style>
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; height: 100vh; user-select: none; -webkit-user-select: none; }
      .splash {
        width: 100%; height: 100%;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background:
          radial-gradient(420px 260px at 78% -6%, rgba(216, 189, 132, 0.14), transparent 65%),
          radial-gradient(380px 240px at 18% -10%, rgba(240, 216, 192, 0.12), transparent 62%),
          #0a0909;
        border-radius: 18px;
        position: relative;
      }
      .mark { width: 96px; height: 96px; animation: float 3.2s ease-in-out infinite; }
      .mark { filter: drop-shadow(0 12px 28px rgba(216, 189, 132, 0.22)); }
      .word { display: flex; flex-direction: column; align-items: center; gap: 5px; }
      .name {
        font-family: "Segoe UI", "Inter", sans-serif;
        font-size: 26px; font-weight: 650; letter-spacing: 0.22em; color: #eaf0e6; padding-left: 0.22em;
      }
      .name span { background: linear-gradient(100deg, #f6e7c1, #d9bd84 45%, #a8833f 70%, #f4e3b8); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .tag {
        font-family: "Segoe UI", "Inter", sans-serif;
        font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(216, 198, 164, 0.6); font-weight: 500;
      }
      .pulse { width: 26px; height: 26px; margin-top: 6px; }
      .pulse .ring { fill: none; stroke: url(#g); stroke-width: 2.4; stroke-linecap: round; stroke-dasharray: 26; opacity: 0.85; animation: spin 1.6s linear infinite; transform-origin: center; }
      @keyframes float { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
      @keyframes spin { to { transform: rotate(360deg) } }
    </style>
  </head>
  <body>
    <div class="splash">
      <img class="mark" src="src/assets/fluxora-mark.svg" alt="" draggable="false" />
      <div class="word">
        <div class="name">FLU<span>X</span>ORA</div>
        <div class="tag">AI Operating Workspace</div>
      </div>
      <svg class="pulse" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f6e7c1" />
            <stop offset="0.5" stop-color="#d9bd84" />
            <stop offset="1" stop-color="#a8833f" />
          </linearGradient>
        </defs>
        <circle class="ring" cx="16" cy="16" r="8" />
      </svg>
    </div>
  </body>
</html>
